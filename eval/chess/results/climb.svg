<svg xmlns="http://www.w3.org/2000/svg" width="920" height="538" viewBox="0 0 920 538" role="img" aria-labelledby="t d">
<title id="t">Each model alone, then with Suture</title><desc id="d">Maia 1900: alone 1663, with Suture 1794; NNUE, 1 ply: alone 1039, with Suture 1747; Maia 1100: alone 1360, with Suture 1642; Maia 1500: alone 1516, with Suture 1595; Jev 1.14 (TypeSafe): alone lost all 80, with Suture 1367; Decider V1.2 (Perplexity): alone lost all 80, with Suture 1306; Clef (Cloudflare): alone 1 draw in 80, with Suture 1246; GPT-6 Luna Decisions (OpenAI): alone lost all 80, with Suture 1217; Laguna S 2.1 (Poolside): alone lost all 20, with Suture 1197; Gemma 4 31B (Google): alone lost all 80, with Suture 1144; Nemotron 3 Ultra (NVIDIA): alone lost all 80, with Suture 1020; Suture's rules with no model 1355.</desc>
<style>
:root { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --band: #ecebe6;
