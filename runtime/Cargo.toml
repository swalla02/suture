[package]
name = "suture-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "The Suture runtime: compiled programs running on the interaction-net kernel"
publish = false

[dependencies]
suture = { path = ".." }
suture-lang = { path = "../lang" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
