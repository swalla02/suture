[package]
name = "suture"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Suture: a typed, deterministic interaction-net kernel (Learned Interaction Machine v0)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
siphasher = "1"
thiserror = "2"

[workspace]
members = ["lang", "runtime", "cli", "eval/claims/baseline", "eval/chess/engine", "eval/chess/ladder"]
